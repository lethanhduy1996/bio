<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Duy Lê Thành</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="nav">
    <a class="brand" href="#about">Duy Lê Thành</a>
    <div class="nav-links">
      <a href="#about">Trang chủ</a>
      <a href="#intro">Giới thiệu</a>
      <a href="#catalog">Danh sách</a>
    </div>
    <div class="nav-actions">
      <button class="icon-btn" id="themeBtn" type="button">☾</button>
      <button class="hamburger" id="menuBtn" type="button">☰</button>
    </div>
    <div class="mobile-menu" id="mobileMenu">
      <a href="#about">Trang chủ</a>
      <a href="#intro">Giới thiệu</a>
      <a href="#catalog">Danh sách</a>
      <a href="admin.html">Admin</a>
    </div>
  </nav>
  <header class="hero" id="about">
    <div class="avatar-wrap">
      <img src="https://avatars.githubusercontent.com/u/281629102?v=4" alt="Duy Lê Thành" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'" />
      <div class="avatar-fallback" style="display:none">DL</div>
    </div>
    <h1 class="name">Duy Lê Thành <span class="verified"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></span></h1>
    <p class="role">Admin · @lethanhduyy</p>
    <p class="pitch">Kênh thông báo, nhóm chat và danh sách liên kết. Admin up link bằng key.</p>
    <div class="socials">
      <a class="social s-tg" href="https://t.me/ipahackgameioss" target="_blank" rel="noopener">✈</a>
      <a class="social s-tg" href="https://t.me/ipahackgameios" target="_blank" rel="noopener">💬</a>
      <a class="social s-ad" href="https://t.me/lethanhduyy" target="_blank" rel="noopener">Adm</a>
    </div>
  </header>
  <main>
    <section id="intro">
      <div class="wrap">
        <div class="label">Giới thiệu</div>
        <div class="card-stack" id="linkList"></div>
      </div>
    </section>
    <section id="catalog">
      <div class="wrap">
        <div class="label">Danh sách liên kết</div>
        <div class="tabs">
          <button class="tab active" data-group="esign" type="button">ESign</button>
          <button class="tab" data-group="ksign" type="button">KSign</button>
        </div>
        <div class="install-list" id="catalogList"></div>
      </div>
    </section>
  </main>
  <footer class="footer">
    <div class="legal"><a href="#about">Trang chủ</a><span>|</span><a href="admin.html">Admin</a></div>
    <p>Copyright © 2026 Duy Lê Thành · @lethanhduyy</p>
  </footer>
  <script src="app.js"></script>
  <script>
    document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "dark");
    document.getElementById("themeBtn").onclick = () => {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
    };
    document.getElementById("menuBtn").onclick = () => document.getElementById("mobileMenu").classList.toggle("open");
    document.getElementById("mobileMenu").onclick = () => document.getElementById("mobileMenu").classList.remove("open");
    let catalog = [];
    let group = "esign";
    function paint() { Bio.renderCatalog("#catalogList", catalog, group); }
    document.querySelectorAll(".tab").forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        group = tab.dataset.group;
        paint();
      };
    });
    Bio.getLinks().then(links => Bio.renderLinks("#linkList", links));
    Bio.getCatalog().then(items => { catalog = items; paint(); });
  </script>
</body>
</html>
